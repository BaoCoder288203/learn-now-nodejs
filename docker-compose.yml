version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-toeic_secret_access_token_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-toeic_secret_refresh_token_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - sqlite_data:/app/prisma

volumes:
  sqlite_data:
