name: Deploy Learn Now API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/baocoder288203/learn-now-api
  PYMUPDF_IMAGE: ghcr.io/baocoder288203/learn-now-pymupdf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:main
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PyMuPDF image
        uses: docker/build-push-action@v6
        with:
          context: ./pymupdf-sidecar
          file: ./pymupdf-sidecar/Dockerfile
          push: true
          tags: |
            ${{ env.PYMUPDF_IMAGE }}:main
            ${{ env.PYMUPDF_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to EC2 via Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            docker-compose pull api pymupdf
            docker-compose up -d
            docker image prune -f
            docker-compose ps
            for i in {1..10}; do
              if curl -sf http://localhost:4000/health; then
                break
              fi
              echo "Đang chờ ứng dụng sẵn sàng..."
              sleep 5
            done

            curl -sf http://localhost:4000/health || exit 1
